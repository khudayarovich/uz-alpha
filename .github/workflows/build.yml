name: build

# Every push builds and tests. A tag vX.Y.Z (matching src/common/version.h)
# also publishes a GitHub release with the Windows app and the macOS keyboards.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and test
        shell: cmd
        run: build.cmd test

      - name: Install on this clean machine, check, remove
        shell: pwsh
        run: ./tools/ci-install-test.ps1

      - name: Package
        shell: pwsh
        run: |
          $ver = (Select-String -Path src/common/version.h -Pattern 'UZA_VER_STR "(.+)"').Matches[0].Groups[1].Value
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$ver") {
            throw "The tag $env:GITHUB_REF_NAME does not match the version in version.h ($ver)."
          }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/app/UzAlpha.exe dist/
          $hash = (Get-FileHash dist/UzAlpha.exe -Algorithm SHA256).Hash.ToLower()
          # Read by the app's update check (src/app/update.cpp).
          [IO.File]::WriteAllText("$PWD/dist/update.txt", "version=$ver`nsha256=$hash`nfile=UzAlpha.exe`n")
          Get-Content dist/update.txt

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Layout files match the generator
        run: |
          node tools/gen-mac-layouts.mjs third_party/kiritish/ozbekcha-yangi-alifbo.keylayout mac/UzAlpha.bundle/Contents/Resources
          git diff --exit-code -- mac

      - name: Type through the layouts with macOS itself
        run: swift tools/mac-layout-test.swift mac/UzAlpha.bundle

      - name: Package
        run: |
          mkdir -p dist/UzAlpha-macOS
          cp -R mac/UzAlpha.bundle mac/install.command dist/UzAlpha-macOS/
          chmod +x dist/UzAlpha-macOS/install.command
          cd dist
          ditto -c -k --keepParent UzAlpha-macOS UzAlpha-macOS.zip

          # The disk image holds the same files, plus a shortcut to the system's
          # keyboard folder (the bundle is dragged onto it) and a short how-to.
          ln -s "/Library/Keyboard Layouts" "UzAlpha-macOS/Keyboard Layouts"
          cp ../mac/dmg-readme.txt UzAlpha-macOS/README.txt
          xattr -w com.apple.TextEncoding "utf-8;134217984" UzAlpha-macOS/README.txt
          # hdiutil now and then answers "Resource busy" on the build machines.
          for attempt in 1 2 3 4 5; do
            if hdiutil create -volname UzAlpha -srcfolder UzAlpha-macOS -fs HFS+ -format UDZO -ov UzAlpha-macOS.dmg; then
              break
            fi
            if [ "$attempt" = 5 ]; then echo "could not create the disk image"; exit 1; fi
            sleep 5
          done
          rm -rf UzAlpha-macOS
          ls -l

      - name: Open the disk image and install the keyboards from it
        run: |
          mount="$RUNNER_TEMP/uzalpha-dmg"
          mkdir -p "$mount"
          hdiutil attach dist/UzAlpha-macOS.dmg -nobrowse -readonly -mountpoint "$mount"
          ls -la "$mount"
          diff -r mac/UzAlpha.bundle "$mount/UzAlpha.bundle"
          test -x "$mount/install.command"
          test -s "$mount/README.txt"
          test "$(readlink "$mount/Keyboard Layouts")" = "/Library/Keyboard Layouts"
          swift tools/mac-layout-test.swift "$mount/UzAlpha.bundle"
          hdiutil detach "$mount"

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          gh release create "$GITHUB_REF_NAME" \
            --title "UzAlpha ${GITHUB_REF_NAME#v}" \
            --notes-file .github/release-notes.md \
            dist/UzAlpha.exe dist/update.txt dist/UzAlpha-macOS.dmg dist/UzAlpha-macOS.zip
